name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Manual full rebuild (detect treats a dispatch as "no diff base" → all).
  workflow_dispatch: {}

jobs:
  # ── Change detection ─────────────────────────────────────────────────────
  # Build ONLY the images whose code changed in this push (same strategy as
  # the WASAT monorepo). Conservative by design: tag pushes, unknown diff
  # bases (first push / force-push), and Dockerfile/dependency changes
  # rebuild the affected image; docs/tests/manual-only changes build nothing.
  detect:
    # HARD STOP: only run in hitsainet/miStudio (public/clean mirror repo)
    if: github.repository == 'hitsainet/miStudio' || github.repository == 'hitsainet/mistudio'
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to diff the push range

      - name: Detect changed images
        id: detect
        env:
          REF: ${{ github.ref }}
          CREATED: ${{ github.event.created }}
        run: |
          set -euo pipefail
          ALL=(backend frontend)
          emit_all() { printf '%s\n' "${ALL[@]}" | jq -R . | jq -cs .; }

          # Tag push: a NEW tag (a release) → full rebuild. An EXISTING tag moved
          # onto a new snapshot → nothing.
          #
          # sync-to-clean retargets every existing mirror tag onto each snapshot,
          # because the mirror holds one commit and a stale tag would pin old
          # history. That force-push fired this workflow a second time on EVERY
          # sync and rebuilt every image, producing a second backend image with a
          # new digest that Image Updater rolled out minutes after the first. The
          # first rollout looks like the deploy; the second kills whatever started
          # in between. On 2026-09-12 it killed an activation extraction at 20.8%,
          # and the same morning a docs-only push rolled the backend.
          if [[ "$REF" == refs/tags/* ]]; then
            echo "tag push: created=${CREATED}"
            if [ "$CREATED" != "true" ]; then
              echo "images=[]" >> "$GITHUB_OUTPUT"; echo "existing tag retargeted by sync → nothing to build"; exit 0
            fi
            echo "images=$(emit_all)" >> "$GITHUB_OUTPUT"; echo "new tag → all"; exit 0
          fi

          # ── The diff base is PER IMAGE, and it is the commit that image was
          # ── actually built from.
          #
          # ⚠ THIS USED TO DIFF `github.event.before`, WHICH STRANDS IMAGES SILENTLY.
          # An image can fail to publish for a reason unrelated to its own code — a runner
          # OOM, a registry flake, a Docker Hub outage. The next push then diffs from the
          # commit that was never built, sees no changes under that image's paths, and skips
          # it. And again. The published image drifts from main indefinitely with every run
          # green, until a human notices and dispatches a full rebuild.
          #
          # miLLM hit exactly this on 2026-09-27 and its admin-ui image reached the cluster
          # only because the rebuild was triggered by hand. miStudio has no test gate in this
          # workflow, so the trigger here would be a transient failure rather than a red
          # suite — same outcome.
          #
          # Reading each image's own `org.opencontainers.image.revision` makes this
          # SELF-CORRECTING: an image that was not published keeps its old revision, so the
          # next run diffs across everything it missed. No state to keep in sync, and the
          # registry is the authority on what is actually deployed.
          #
          # Conservative at every failure: no label, an unreachable registry, or a commit git
          # cannot resolve all mean "build it". Never silently skip.

          published_revision() {
            # Echo the commit `<repo>:latest` was built from, or nothing.
            #
            # ⚠ TWO THINGS HERE ARE LOAD-BEARING and both failed SILENTLY when first written,
            # returning empty (which reads as "never published") rather than erroring:
            #   1. `-L` on the BLOB fetch — Docker Hub 307-redirects blob reads to a CDN, and
            #      curl without -L prints nothing and exits 0.
            #   2. Following the INDEX — `:latest` is multi-arch with no `.config` of its own.
            # Verified against a real public image carrying a real label before shipping.
            local repo="$1" token accept doc mt cfg child
            accept='application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.index.v1+json'

            token="$(curl -fsSL --max-time 30 \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull" \
              | jq -r .token 2>/dev/null)" || return 0
            [ -n "$token" ] && [ "$token" != "null" ] || return 0

            doc="$(curl -fsSL --max-time 30 -H "Authorization: Bearer ${token}" -H "Accept: ${accept}" \
              "https://registry-1.docker.io/v2/${repo}/manifests/latest" 2>/dev/null)" || return 0

            mt="$(echo "$doc" | jq -r '.mediaType // empty' 2>/dev/null)"
            case "$mt" in
              *manifest.list*|*image.index*)
                child="$(echo "$doc" | jq -r '
                  [.manifests[] | select((.platform.os=="linux") and (.platform.architecture=="amd64")
                    and ((.platform.variant // "")|test("unknown")|not))] | .[0].digest // empty' 2>/dev/null)"
                [ -n "$child" ] || return 0
                doc="$(curl -fsSL --max-time 30 -H "Authorization: Bearer ${token}" -H "Accept: ${accept}" \
                  "https://registry-1.docker.io/v2/${repo}/manifests/${child}" 2>/dev/null)" || return 0
                ;;
            esac

            cfg="$(echo "$doc" | jq -r '.config.digest // empty' 2>/dev/null)"
            [ -n "$cfg" ] || return 0

            curl -fsSL --max-time 30 -H "Authorization: Bearer ${token}" \
              "https://registry-1.docker.io/v2/${repo}/blobs/${cfg}" 2>/dev/null \
              | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' 2>/dev/null \
              || true
          }

          repo_for() {
            case "$1" in
              backend)  echo "hitsai/mistudio-backend" ;;
              frontend) echo "hitsai/mistudio-frontend" ;;
              *) echo "" ;;
            esac
          }

          paths_for() {
            case "$1" in
              backend)  echo '^(backend/|Dockerfile|docker-entrypoint\.sh|pyproject\.toml|alembic)' ;;
              frontend) echo '^frontend/' ;;
              *) echo '^$' ;;
            esac
          }

          OUT=()
          for img in "${ALL[@]}"; do
            repo="$(repo_for "$img")"
            base="$(published_revision "$repo" || true)"

            if [ -z "$base" ]; then
              echo "$img: no published revision recorded → build"
              OUT+=("$img"); continue
            fi

            # The mirror's main is force-pushed as an orphan, so a previous revision is an
            # unadvertised object here. GitHub serves those by explicit SHA.
            git cat-file -e "${base}^{commit}" 2>/dev/null \
              || git fetch --no-tags --depth=1 origin "$base" 2>/dev/null \
              || true
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "$img: published revision ${base} is not resolvable here → build"
              OUT+=("$img"); continue
            fi

            if [ "$base" = "$GITHUB_SHA" ]; then
              echo "$img: already published from this exact commit → skip"; continue
            fi

            CHANGED="$(git diff --name-only "$base" "$GITHUB_SHA" || true)"
            if [ -z "$CHANGED" ]; then
              echo "$img: no file changes since ${base:0:8} → skip"; continue
            fi
            if echo "$CHANGED" | grep -qE "$(paths_for "$img")"; then
              echo "$img: changed since published ${base:0:8} → build"
              OUT+=("$img")
            else
              echo "$img: unchanged since published ${base:0:8} → skip"
            fi
          done

          if [ ${#OUT[@]} -eq 0 ]; then
            echo "images=[]" >> "$GITHUB_OUTPUT"; echo "no image-affecting changes → nothing to build"
          else
            JSON="$(printf '%s\n' "${OUT[@]}" | jq -R . | jq -cs .)"
            echo "images=$JSON" >> "$GITHUB_OUTPUT"; echo "building: $JSON"
          fi

  build:
    needs: detect
    if: (github.repository == 'hitsainet/miStudio' || github.repository == 'hitsainet/mistudio') && needs.detect.outputs.images != '[]' && needs.detect.outputs.images != ''
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.detect.outputs.images) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve image build parameters
        id: img
        run: |
          case "${{ matrix.name }}" in
            backend)
              echo "repo=hitsai/mistudio-backend"     >> "$GITHUB_OUTPUT"
              echo "context=./backend"                >> "$GITHUB_OUTPUT"
              echo "dockerfile=./backend/Dockerfile"  >> "$GITHUB_OUTPUT"
              ;;
            frontend)
              echo "repo=hitsai/mistudio-frontend"      >> "$GITHUB_OUTPUT"
              echo "context=./frontend"                 >> "$GITHUB_OUTPUT"
              echo "dockerfile=./frontend/Dockerfile"   >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ERROR: unknown image ${{ matrix.name }}"; exit 1
              ;;
          esac

      # The torch/CUDA-based backend image is large (~9 min build); reclaim
      # runner disk first.
      - name: Free disk space
        if: matrix.name == 'backend'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune -af
          df -h /

      # Both images embed the Apache-2.0 LICENSE; it lives at the repo root but
      # each build context is a subdirectory, so copy it in before building.
      - name: Copy LICENSE to build context
        run: |
          cp LICENSE "${{ steps.img.outputs.context }}/"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "tags=${{ steps.img.outputs.repo }}:latest,${{ steps.img.outputs.repo }}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            SHA="${GITHUB_SHA::8}"
            VERSION="$(cat VERSION 2>/dev/null || echo 0.0.0)+${SHA}"
            echo "tags=${{ steps.img.outputs.repo }}:latest,${{ steps.img.outputs.repo }}:${SHA}" >> "$GITHUB_OUTPUT"
          fi
          # MIS-E2E-028: the version the IMAGE reports, not just the tag it
          # carries. Every deployed pod answered `GET /api/v1/version` with
          # "unknown" because `VERSION` lives at the repo root and the backend
          # build context is `backend/`, so the file never entered the image.
          # A build arg reaches across that boundary where a COPY cannot.
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }} image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.img.outputs.context }}
          file: ${{ steps.img.outputs.dockerfile }}
          push: true
          tags: ${{ steps.version.outputs.tags }}
          # ⚠ THIS LABEL IS WHAT `detect` DIFFS FROM — the commit this image was actually
          # built from. Removing it does not break the build; it makes `detect` fall back to
          # building everything, forever.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # mode=max attaches full build step provenance (not the default
          # minimal mode), which is what Docker Scout's supply-chain
          # attestation policy checks for.
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/${{ steps.img.outputs.repo }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
