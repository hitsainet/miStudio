# Nginx configuration for MechInterp Studio GCP deployment
# URL: mistudio.hitsai.net

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # BOUNDED (016 R3-B6, 2026-10-16). This read `client_max_body_size 0` — no limit — at
    # the http level, so every server on this public edge accepted bodies of any size.
    # miStudio has NO upload route: every body is JSON, and the backend refuses anything
    # over 1 MiB in middleware (`backend/src/core/body_limit.py`, MAX_BODY_BYTES), metering
    # chunked bodies too. 2m sits just above that cap, so a borderline request reaches the
    # backend and gets its explanatory 413, while a multi-gigabyte body is refused here
    # before it is read. Neuronpedia overrides this in its own server block.
    # `backend/tests/unit/test_nginx_body_bounds.py` pins both.
    client_max_body_size 2m;

    # Upstream definitions
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        # hitsai/mistudio-frontend listens on 8080 (non-root nginx-unprivileged image)
        server frontend:8080;
    }

    upstream neuronpedia {
        server neuronpedia-webapp:3000;
    }

    # Main server block for MechInterp Studio
    server {
        listen 80;
        server_name mistudio.hitsai.net localhost;

        # API endpoints
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeouts for ML operations
            proxy_connect_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # WebSocket endpoint
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket keepalive
            proxy_connect_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # Frontend (default)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Server block for Neuronpedia
    server {
        listen 80;
        server_name neuron.hitsai.net;

        # Neuronpedia's own bound, matching its k8s ingress
        # (`k8s/neuronpedia/base/ingress.yaml`: proxy-body-size 100m).
        client_max_body_size 100m;

        location / {
            proxy_pass http://neuronpedia;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for NextAuth
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
