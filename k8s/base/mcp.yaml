# -------------------------
# MCP SERVER (Feature 010 — agentic access, opt-in)
# Disable: kubectl -n mistudio scale deploy/mistudio-mcp --replicas=0
# Exposed through `mistudio-mcp-ingress` below (bearer token on every request
# except /health; proven against the assembled app by
# backend/tests/unit/test_mcp_http_auth.py). Requires mcp-auth-token in
# mistudio-secrets — without it the pod refuses to start rather than serve open.
# -------------------------
# Reuses the hitsai/mistudio-backend image. Its tag/digest is managed by ArgoCD
# Image Updater via the single kustomization images entry — do not hand-edit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mistudio-mcp
  namespace: mistudio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mistudio-mcp
  template:
    metadata:
      labels:
        app: mistudio-mcp
    spec:
      containers:
        - name: mcp-server
          image: hitsai/mistudio-backend:latest
          command: ["python", "-m", "src.mcp_server"]
          ports:
            - containerPort: 8765
          env:
            - name: MISTUDIO_API_URL
              value: http://mistudio-backend:8000
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mistudio-secrets
                  key: mcp-auth-token
            - name: MCP_TOOL_CATEGORIES
              # THIS is the manifest ArgoCD deploys (k8s/base via kustomize).
              # `circuits` is in the code's DEFAULT_CATEGORIES and this explicit
              # list silently overrode it, so all 19 circuit tools AND the 16
              # millm_circuit_* tools were unreachable in production while
              # being registered, tested and documented.
              #
              # `admin` stays OFF deliberately — two irreversible delete tools
              # (delete_extraction takes every feature, label and activation
              # example with it), and it is not in DEFAULT_CATEGORIES either.
              value: "read,groups,steering,labeling,experiments,profiles,circuits,jlens,jobs,models,probe_monitors,millm_runtime,millm_clusters,millm_sensing,millm_circuits,millm_models,millm_probes,millm_inference,dataworks"
            # Unified MCP (miLLM Feature 9): millm_* categories talk to the
            # miLLM deployment; unset/empty URL skips them at registration.
            - name: MILLM_API_URL
              value: "http://millm-backend.millm.svc.cluster.local:8000"
            # Feature 034 (FR-6, FR-8): the miDataworks proxy (`dataworks_*`). NOT
            # DATAWORKS_API_URL — that is miDataworks' own MCP server's variable.
            - name: MIDATAWORKS_API_URL
              value: "http://midataworks-backend.midataworks.svc.cluster.local:8000"
            # MCP gap G9 (2026-10-21): read ONLY by gpu_preflight, which lists miForge's
            # pending/running runs. Unset = "not configured", never an error.
            - name: MIFORGE_API_URL
              value: "http://miforge-backend.miforge.svc.cluster.local:8000"
            - name: MCP_STEERING_APPROVAL
              value: "false"
            # ENH-008: MCP_MILLM_LOAD_APPROVAL is gone. An agent's miLLM model load
            # waits for the operator in miLLM's own Approvals page, unconditionally.
            # 2026-10-19: an agent's probe training run or probe evaluation holds a
            # GPU for minutes to hours, so it waits for operator approval too.
            # FAILS CLOSED: "true" here and in code. Pinned by
            # test_reachability.py::TestTheDEPLOYMENTEnablesWhatTheCodeRegisters.
            - name: MCP_PROBE_GPU_APPROVAL
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mistudio-mcp
  namespace: mistudio
spec:
  type: ClusterIP
  selector:
    app: mistudio-mcp
  ports:
    - port: 8765
---
# MCP ingress. Dedicated hosts mcp-mistudio.hitsai.{local,net} resolve on the
# LAN only (hosts file / local DNS) unless you publish the .net name in public
# DNS/Cloudflare yourself. Bearer auth applies either way.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mistudio-mcp-ingress
  namespace: mistudio
  annotations:
    # MCP streamable HTTP: long-lived responses + SSE streams
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # = MCP_MAX_REQUEST_BODY_BYTES (src/mcp_server/server.py), so the server, not the edge,
    # answers an oversized call. It read "10m" while millm_upload_batch_file admits 16 MiB.
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
spec:
  ingressClassName: public
  rules:
    # Path-based route on the shared miStudio host (kept for compatibility)
    - host: k8s-mistudio.hitsai.local
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: mistudio-mcp
                port:
                  number: 8765
    # Dedicated MCP hosts — full path space (/mcp for protocol, /health for checks).
    # LAN-resolved via /etc/hosts or local DNS; the .net name is NOT published in
    # public DNS/Cloudflare by default. Bearer auth enforced on every request.
    - host: mcp-mistudio.hitsai.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mistudio-mcp
                port:
                  number: 8765
    - host: mcp-mistudio.hitsai.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mistudio-mcp
                port:
                  number: 8765
    # MCP gap G1 (2026-10-21): the suite's mcp-<app> naming, following miForge's
    # gitops/pilot/mcp.yaml (mcp-forge.*). The public name mcp-studio.hitsai.net
    # reaches this cluster through Cloudflare → nginx on .10, which REWRITES Host to
    # k8s-<name>.hitsai.local — so k8s-mcp-studio.hitsai.local is the rule that
    # actually matches off-LAN traffic, and mcp-studio.hitsai.net is kept for a
    # direct route. Bearer auth on every request except /health; agent GPU calls
    # still pass operator approval. Cloudflare/nginx/DNS are operator steps.
    - host: mcp-studio.hitsai.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mistudio-mcp
                port:
                  number: 8765
    - host: k8s-mcp-studio.hitsai.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mistudio-mcp
                port:
                  number: 8765
    - host: mcp-studio.hitsai.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mistudio-mcp
                port:
                  number: 8765
