name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  # ── SHARDED (operator directive, 2026-10-20) ─────────────────────────────────────────
  # The whole tree in one job took 17-23 minutes here, against ~6.5 for the same command on
  # the public mirror. Two reasons, both measured: this private repository's hosted runner
  # has 2 vCPUs where the public mirror's has 4, so `-n 4` was oversubscribed; and the
  # mirror's 6.5-minute figure dates from 2026-08-23 - its Backend Tests has not run since,
  # because its path filter never matches the force-pushed orphan snapshot - when the tree
  # was smaller. So the tree is split across SHARDS by file (`CI_SHARD`, read by the root
  # conftest's `pytest_ignore_collect`; tests/support/ci_shard.py balances the split on
  # recorded per-file durations), each with its own PostgreSQL and Redis, and `all-shards`
  # below is green only when every shard is. sync-to-clean's gate requires that job.
  # tests/unit/test_ci_shards.py proves every test file runs in exactly one shard;
  # tests/unit/test_private_ci_trust.py pins this matrix, CI_SHARD and the aggregator.
  test:
    name: Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: mistudio_test
          POSTGRES_USER: mistudio
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI_SHARD: ${{ matrix.shard }}/5
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_URL: postgresql+asyncpg://mistudio:testpassword@localhost:5432/mistudio_test
      DATABASE_URL_SYNC: postgresql+psycopg2://mistudio:testpassword@localhost:5432/mistudio_test
      SECRET_KEY: ci-test-secret-key-minimum-32-characters-long
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      REDIS_URL: redis://localhost:6379/0
      DATA_DIR: /tmp/mistudio-ci
      HF_HOME: /tmp/mistudio-ci/huggingface_cache
      HF_CACHE_DIR: /tmp/mistudio-ci/huggingface_cache
      # Read by tests/unit/test_orm_matches_migrated_schema.py — a migrated
      # database that conftest's drop_all never touches.
      SCHEMA_CHECK_DATABASE_URL: postgresql://mistudio:testpassword@localhost:5432/mistudio_schema_check

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: Install PyTorch (CPU)
        run: |
          # MUST equal requirements.txt's torch pin (test_pinned_versions_match_the_venv.py):
          # below it, pip replaces this CPU wheel with PyPI's CUDA torch and its nvidia-* stack.
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          # Exclude GPU-only packages that cannot install on CPU runners:
          #   triton  - CUDA compiler, Linux/GPU only
          #   bitsandbytes - quantization library, requires CUDA at runtime
          grep -vE "^(triton|bitsandbytes)==" backend/requirements.txt \
            | pip install -r /dev/stdin -c backend/constraints.txt

      # MIGRATE BEFORE TESTING (MIS-E2E-030 / -031 follow-on).
      #
      # `test_orm_matches_migrated_schema.py` reflects the MIGRATED database on
      # purpose: the divergence it exists to catch is between the ORM (which is
      # what `Base.metadata.create_all()` builds for the unit suite) and what
      # the migrations actually produce. Reflecting a `create_all()` schema
      # would compare the ORM against itself and pass forever.
      #
      # CI never ran `alembic upgrade head`, so those tables did not exist here
      # and the guard failed with NoSuchTableError on its first push. Skipping
      # it on a missing table would be worse than the failure — it is the only
      # place this check runs automatically, and it would fail OPEN in exactly
      # the environment that is supposed to enforce it.
      # A SEPARATE database, because `conftest.async_engine` is function-scoped
      # and runs `Base.metadata.drop_all` on teardown. Migrating the database
      # the unit fixtures manage does not survive the first test — which is
      # exactly what happened on the first attempt at this fix: alembic ran,
      # the log shows every revision applied, and the guard still failed with
      # NoSuchTableError because the tables had since been dropped.
      - name: Create and migrate the schema-check database
        working-directory: backend
        env:
          PGPASSWORD: testpassword
        run: |
          psql -h localhost -U mistudio -d mistudio_test \
            -c "CREATE DATABASE mistudio_schema_check;"
          DATABASE_URL=postgresql+asyncpg://mistudio:testpassword@localhost:5432/mistudio_schema_check \
          DATABASE_URL_SYNC=postgresql+psycopg2://mistudio:testpassword@localhost:5432/mistudio_schema_check \
            alembic upgrade head
          echo "Schema-check database migrated."

      # The catalog snapshot of the freshly migrated schema, kept as an artifact so a
      # production pod's snapshot (`python -m src.db.schema_parity snapshot`) can be
      # diffed against what CI built from the same commit.
      - name: Snapshot the migrated schema
        if: matrix.shard == 1   # one artifact per run; every shard migrates the same tree
        working-directory: backend
        run: |
          python -m src.db.schema_parity snapshot \
            --url postgresql://mistudio:testpassword@localhost:5432/mistudio_schema_check \
            > "$RUNNER_TEMP/migrated-schema-snapshot.json"

      - name: Upload the migrated schema snapshot
        if: matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: migrated-schema-snapshot
          path: ${{ runner.temp }}/migrated-schema-snapshot.json

      - name: Run tests
        working-directory: backend
        run: |
          # test_activation_service.py is no longer ignored. Its CUDA-bound tests
          # carry @requires_cuda and skip themselves on a runner with no GPU, so
          # the four tests in that file which need no GPU now actually run here —
          # ignoring the whole file had been discarding them silently.
          # --dist loadfile, measured locally 2026-09-25 over 7,510 tests:
          #   serial                              16m22s
          #   -n 8 with xdist's default --dist load  36m03s  (2.2x SLOWER)
          #   -n 4 --dist loadfile                 4m56s   (identical counts)
          # loadfile keeps a file's tests on one worker, so torch/transformers
          # imports are paid once per file instead of scattered; tests/support/
          # xdist_isolation.py gives each worker its own auto-created database
          # and pins BLAS to one thread per worker. Drop the flags to bisect a
          # failure that only appears in parallel — the serial path still works.
          # `-n auto` = one worker per vCPU: 2 on this repo's runner, where the
          # old fixed `-n 4` oversubscribed it. CI_SHARD (job env) picks this
          # shard's files; unset, the same command runs the whole tree.
          python -m pytest tests/ \
            --ignore=tests/integration \
            -m "not slow" \
            -n auto --dist loadfile \
            -v --no-cov --tb=short

  # The single verdict for every shard: green only if each one is. A shard that failed,
  # was cancelled or never ran makes this red (a matrix job's `result` is `success` only
  # when every leg succeeded). sync-to-clean's gate requires THIS job by name, so the
  # mirror never receives a commit on a partial set of shards.
  all-shards:
    name: all shards
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to have passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$RESULTS" > /dev/null
