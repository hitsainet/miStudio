name: Sync to Clean Repository

# Publishes a FILTERED snapshot of this repo to the public mirror
# (hitsainet/miStudio).
#
# ── WHY THIS IS AN ORPHAN COMMIT, NOT A FILTERED BRANCH ────────────────────
# This workflow used to `rm -rf` the excluded paths and then
# `git push --force main`. The exclusion list was correct and the mirror's TIP
# was genuinely clean — but the push shipped the whole branch, so all 1,209
# unmodified source commits went with it. The mirror's HEAD~1 was our source
# commit verbatim, and every excluded path was one command away:
#
#     git show HEAD~1:0xcc/audits/.../FINDINGS.md
#
# That published an SSH password (scripts/k8s-helpers.sh), five database dumps
# (backups/), CLAUDE.md, and the whole 0xcc/ tree — and GitHub serves commits by
# SHA regardless of reachability, so a later force-push does not retract them.
# Recorded as MIS-E2E-143.
#
# The fix is not a longer exclusion list. `git checkout --orphan` creates a
# commit with NO PARENTS, so there is no history to leak — not because the list
# is right, but because nothing else exists to publish. Excluded BY
# CONSTRUCTION, not by policy, which is the same discipline BR-002 applies to
# band constants.
#
# The "Verify" step below then proves it against the pushed result, because the
# absence of exactly that check is why this ran unnoticed for months.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # ── THE MIRROR TRUSTS THIS REPOSITORY'S CI (operator directive, 2026-10-20) ────────────
  # The mirror's image build no longer runs or waits for any test suite of its own: it only
  # checks that the snapshot carries the `Private-CI: passed` trailer the `sync` job below
  # writes. So nothing may be published until every CI workflow that runs on main HERE has
  # passed for the exact commit. `.github/scripts/private_ci_gate.py` decides (its docstring
  # gives the rules, including Backend Tests' `all-shards` aggregator and the path-filter
  # fallback); `backend/tests/unit/test_private_ci_trust.py` pins this wiring from the
  # parsed YAML and requires REQUIRED_WORKFLOWS to name every such workflow.
  #
  # Before 2026-10-20 miStudio's image build had NO test gate at all (docker-images.yml's
  # own comment says so), so this is a new guarantee here, not a moved one.
  gate:
    name: Require private CI to have passed
    if: github.repository == 'Onegaishimas/miStudio'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read     # list this commit's workflow runs and their jobs
      contents: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    env:
      REQUIRED_WORKFLOWS: |
        backend-tests.yml
        frontend-ci.yml
    steps:
      - name: Checkout source repository (full history, for the path-filter fallback)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the gate's one dependency
        run: pip install pyyaml==6.0.2

      - name: Require private CI to have passed for this commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: python .github/scripts/private_ci_gate.py

  sync:
    needs: gate
    # HARD STOP: only run in Onegaishimas/miStudio
    if: github.repository == 'Onegaishimas/miStudio'

    runs-on: ubuntu-latest

    # ONE SYNC AT A TIME, IN ORDER. Each sync now waits for its commit's CI, so two pushes
    # minutes apart can finish their gates out of order. Queued syncs run one by one (a newer
    # queued sync replaces an older queued one, which is fine: the newer commit supersedes
    # it), and "Never move the mirror backwards" below refuses to publish a commit older
    # than the one the mirror already holds.
    concurrency:
      group: sync-to-clean-mirror
      cancel-in-progress: false

    permissions:
      contents: read    # the ordering check compares commits through the API

    env:
      MIRROR: hitsainet/miStudio

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          # Depth 1 is deliberate and load-bearing: we publish a snapshot, not a
          # history, so there is no reason to fetch one. Fetching the full
          # history is what made the old failure possible.
          fetch-depth: 1
          # Check out EXACTLY the commit the gate passed. For a tag event that is the
          # tagged commit, as before; for a branch push it is the pushed head.
          ref: ${{ needs.gate.outputs.sha }}

      # A branch sync publishes only if its commit is the private main's current head, or
      # is at or ahead of the commit the mirror already holds (its Source-Commit trailer).
      # Tag syncs are exempt: a release snapshots the tagged tree, as it always has.
      - name: Never move the mirror backwards
        id: order
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_TOKEN: ${{ secrets.HITSAINET_SYNC }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          HEAD_NOW="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          MSG="$(GH_TOKEN="${SYNC_TOKEN}" gh api "repos/${MIRROR}/commits/main" --jq .commit.message 2>/dev/null || true)"
          PUBLISHED="$(git interpret-trailers --parse <<< "$MSG" | sed -n '/^Source-Commit: /{s///p;q;}')"
          if [ "$SHA" = "$HEAD_NOW" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "${SHA} is main's head - publishing."
          elif [ -z "$PUBLISHED" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "The mirror records no Source-Commit yet - publishing."
          else
            STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PUBLISHED}...${SHA}" --jq .status)"
            case "$STATUS" in
              ahead|identical)
                echo "publish=true" >> "$GITHUB_OUTPUT"; echo "${SHA} is ${STATUS} of the published ${PUBLISHED} - publishing." ;;
              *)
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Not publishing ${SHA}: it is ${STATUS} relative to the mirror's ${PUBLISHED}, and main has moved on to ${HEAD_NOW}." ;;
            esac
          fi

      - name: Remove excluded files and folders
        if: steps.order.outputs.publish != 'false'
        run: |
          set -euo pipefail
          rm -rf 0xcc/
          rm -rf .claude/
          rm -f CLAUDE.md
          rm -rf backups/
          # docs/ is dev-internal EXCEPT the vendored public contracts:
          #   docs/schemas/*.json    — frozen interchange schemas
          #   docs/mcp-contract.md   — the generated MCP tool surface
          # Both are required by mirror tests AND by consumers of the public
          # repo. Stripping mcp-contract.md left the mirror's Backend Tests red
          # on EVERY run from 2026-07-26 onward: the test asserts a file the
          # sync deleted, so it could never pass there while the same suite
          # stayed green in this repo.
          find docs/ -mindepth 1 -maxdepth 1 \
            ! -name schemas ! -name mcp-contract.md -exec rm -rf {} +
          rm -rf scripts/
          rm -rf .understand-anything/
          echo "Removed excluded files"

      - name: Build the orphan snapshot
        if: steps.order.outputs.publish != 'false'
        env:
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          VERSION="$(cat VERSION 2>/dev/null || echo unknown)"

          # No parents. The published repo contains this commit and nothing else.
          git checkout --orphan clean
          git add -A
          # The trailers are what the mirror's image build checks (docker-images.yml, job
          # `private-ci`): the source commit, and that the `gate` job passed its CI.
          git commit -m "miStudio ${VERSION} — filtered snapshot from ${SOURCE_SHA::7}" \
            --trailer "Source-Commit: ${SOURCE_SHA}" --trailer "Private-CI: passed"

          # Fail loudly rather than publishing a surprise.
          PARENTS="$(git rev-list --parents -n1 HEAD | wc -w)"
          if [ "$PARENTS" -ne 1 ]; then
            echo "::error::orphan commit has parents — refusing to push"
            exit 1
          fi
          echo "Built orphan snapshot: $(git rev-parse --short HEAD)"

      - name: Push to clean repository
        if: steps.order.outputs.publish != 'false'
        env:
          SYNC_TOKEN: ${{ secrets.HITSAINET_SYNC }}
        run: |
          set -euo pipefail
          git config --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader || true

          REMOTE="https://x-access-token:${SYNC_TOKEN}@github.com/${MIRROR}.git"
          git push --force "$REMOTE" clean:main

          # TAGS MUST POINT AT THE ORPHAN, NEVER AT THE SOURCE COMMIT.
          #
          # `git push <remote> <source-tag>` pushes the objects needed to
          # complete the tag — i.e. the source commit AND ITS ANCESTORS. That
          # would reintroduce exactly the history the orphan snapshot exists to
          # exclude. Verified experimentally: pushing a source tag to a
          # single-commit mirror took it from 1 commit to 2, the second being
          # the commit the snapshot had dropped.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            git tag -f "$TAG" HEAD          # HEAD is the orphan
            git push --force "$REMOTE" "refs/tags/${TAG}"
            echo "Tagged the orphan snapshot as ${TAG}"
          fi

          # RETARGET STALE TAGS. Force-pushing main to the orphan orphans the old
          # commits, but ANY OTHER REF still anchors them as reachable — a clone
          # then fetches the whole history back.
          #
          # Caught by the Verify step on this fix's first run: main was the orphan
          # with 0 parents, and the mirror still reported 826 commits, because
          # refs/tags/v0.5.0 pointed at an old source commit. One leftover tag held
          # the entire history alive.
          #
          # The mirror is a snapshot: it holds exactly one commit, so every tag in
          # it refers to that snapshot by definition. Retarget them all.
          for ref in $(git ls-remote --tags "$REMOTE" | awk '{print $2}' | grep -v '\^{}$'); do
            T="${ref#refs/tags/}"
            git tag -f "$T" HEAD
            git push --force "$REMOTE" "refs/tags/${T}"
            echo "Retargeted stale tag ${T} onto the snapshot"
          done

          # TRIGGER THE MIRROR'S MANUAL DEPLOY EXPLICITLY.
          #
          # `deploy-manual.yml` filters on `paths: ['manual/**']`, and a path
          # filter needs a diff base. The mirror receives a FORCE-PUSHED,
          # SINGLE-COMMIT ORPHAN — there is no previous commit to diff against,
          # so the filter matches nothing and the workflow never fires. It last
          # ran on 2026-08-22 and the published manual sat eighteen days stale
          # while the mirror's own source was current.
          #
          # miLLM's mirror keeps ordinary history, so its filter works and its
          # manual publishes on every sync. This makes miStudio behave the same.
          #
          # The orphan snapshot is NOT the thing to change: it is what keeps the
          # excluded paths out of the public history, verified deliberately.
          # Dropping the path filter is not it either — `deploy-manual` has no
          # repository gate, so it also builds the primary Pages site, and every
          # backend-only push would rebuild a manual that did not change.
          #
          # An explicit dispatch is the precise fix: the primary keeps its
          # filter, the mirror always publishes.
          echo "Dispatching deploy-manual on ${MIRROR}"
          curl -sS -X POST \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${MIRROR}/actions/workflows/deploy-manual.yml/dispatches" \
            -d '{"ref":"main"}' \
            -w '  dispatch HTTP %{http_code}\n' -o /dev/null

      # ── The check whose absence let MIS-E2E-143 run for months ─────────────
      # The old workflow force-pushed and assumed. This clones the PUBLISHED
      # result and asserts the exclusion list holds across EVERY commit, not
      # just the tip — the distinction the old one got wrong.
      - name: Verify the published mirror
        if: steps.order.outputs.publish != 'false'
        env:
          SYNC_TOKEN: ${{ secrets.HITSAINET_SYNC }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${SYNC_TOKEN}@github.com/${MIRROR}.git"
          rm -rf /tmp/verify
          git clone --quiet "$REMOTE" /tmp/verify
          cd /tmp/verify

          FAILED=0

          # --all covers branches AND tags, which is the point: a tag pointing at
          # old history keeps it reachable even when main is a clean orphan.
          COMMITS="$(git rev-list --all --count)"
          echo "Published commits: ${COMMITS}"
          if [ "$COMMITS" -ne 1 ]; then
            echo "::error::mirror has ${COMMITS} commits; a snapshot must have exactly 1"
            echo "::error::a ref other than main is probably anchoring old history:"
            git show-ref | sed 's/^/    /'
            FAILED=1
          fi

          # Every excluded path, checked against ALL commits — the check the old
          # workflow never made. `git log --all -- <path>` finds a path in any
          # commit's tree, reachable or not from the tip.
          for p in 0xcc .claude CLAUDE.md backups scripts .understand-anything; do
            if [ -n "$(git log --all --oneline -- "$p" 2>/dev/null)" ]; then
              echo "::error::LEAK — '${p}' is present in published history"
              FAILED=1
            fi
          done

          # The two paths under docs/ that MUST survive the filter (mirror tests
          # and external consumers both depend on them).
          for p in docs/schemas docs/mcp-contract.md; do
            if [ ! -e "$p" ]; then
              echo "::error::MISSING — '${p}' must be published but is absent"
              FAILED=1
            fi
          done

          # The verdict the mirror's image build requires (docker-images.yml, `private-ci`).
          TRAILERS="$(git log -1 --format='%(trailers:only,unfold)' HEAD)"
          if ! grep -qx "Source-Commit: ${{ needs.gate.outputs.sha }}" <<< "$TRAILERS" \
             || ! grep -qx "Private-CI: passed" <<< "$TRAILERS"; then
            echo "::error::the published snapshot lacks its Source-Commit / Private-CI trailers;"
            echo "::error::the mirror's image build will refuse it"
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::mirror verification FAILED"
            exit 1
          fi
          echo "Mirror verified: 1 commit, no excluded path in any commit."
